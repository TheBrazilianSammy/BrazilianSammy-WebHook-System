name: Disparador Automático Webhook

on:
  schedule:
    # Executa automaticamente a cada 5 minutos na nuvem do GitHub
    - cron: '*/5 * * * *'
  workflow_dispatch: # Permite disparar manualmente se quiser testar

jobs:
  process-webhooks:
    runs-on: ubuntu-latest
    steps:
      - name: Processar mensagens agendadas do Firebase
        run: |
          node -e '
          const https = require("https");
          const projectId = "braziliansammy-webhook";
          const url = `https://firestore.googleapis.com/v1/projects/${projectId}/databases/(default)/documents/scheduled_messages`;

          https.get(url, (res) => {
            let data = "";
            res.on("data", chunk => data += chunk);
            res.on("end", async () => {
              try {
                const parsed = JSON.parse(data);
                if (!parsed.documents) return console.log("Nenhuma mensagem na fila.");
                
                const now = Date.now();

                for (const doc of parsed.documents) {
                  const fields = doc.fields;
                  const targetTime = Number(fields.targetTime.integerValue || fields.targetTime.doubleValue);
                  
                  if (targetTime <= now) {
                    const webhookUrl = fields.url.stringValue;
                    const payloadStr = fields.payload.stringValue;
                    
                    console.log("Disparando webhook agendado...");
                    
                    // Envia para o Discord
                    const req = https.request(webhookUrl, {
                      method: "POST",
                      headers: { "Content-Type": "application/json" }
                    });
                    req.write(payloadStr);
                    req.end();
                  }
                }
              } catch (e) {
                console.error("Erro ao processar:", e);
              }
            });
          });
          '
