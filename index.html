<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrazilianSammy WebHook System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #1e293b;
            padding: 2rem;
            border-radius: 12px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }
        h2 {
            text-align: center;
            margin-bottom: 1.5rem;
            color: #38bdf8;
        }
        label {
            display: block;
            margin-top: 1rem;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            color: #cbd5e1;
        }
        input, textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #334155;
            border-radius: 6px;
            background-color: #0f172a;
            color: #fff;
            box-sizing: border-box;
            font-size: 1rem;
        }
        textarea {
            resize: vertical;
            height: 100px;
        }
        button {
            width: 100%;
            margin-top: 1.5rem;
            padding: 0.75rem;
            background-color: #0284c7;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #0369a1;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Agendador Webhook</h2>
        
        <label for="webhookUrl">URL do Webhook do Discord:</label>
        <input type="url" id="webhookUrl" placeholder="https://discord.com/api/webhooks/..." required>

        <label for="username">Nome do Bot (Opcional):</label>
        <input type="text" id="username" placeholder="BrazilianSammy Bot">

        <label for="avatarUrl">URL do Avatar (Opcional):</label>
        <input type="url" id="avatarUrl" placeholder="https://exemplo.com/imagem.png">

        <label for="messageContent">Mensagem:</label>
        <textarea id="messageContent" placeholder="Digite a mensagem que será enviada..." required></textarea>

        <label for="scheduleTime">Data e Hora do Envio:</label>
        <input type="datetime-local" id="scheduleTime" required>

        <button id="scheduleBtn">AGENDAR NA NUVEM</button>
    </div>

    <!-- Script de Integração com Firebase e Lógica de Envio -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Substitua com as suas credenciais reais do Firebase
        const firebaseConfig = {
            apiKey: "SUA_API_KEY_AQUI",
            authDomain: "braziliansammy-webhook.firebaseapp.com",
            projectId: "braziliansammy-webhook",
            storageBucket: "braziliansammy-webhook.appspot.com",
            messagingSenderId: "SEU_MESSAGING_SENDER_ID",
            appId: "SEU_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function scheduleWebhook() {
            const webhookUrl = document.getElementById("webhookUrl").value.trim();
            const username = document.getElementById("username").value.trim() || "BrazilianSammy Bot";
            const avatarUrl = document.getElementById("avatarUrl").value.trim();
            const messageContent = document.getElementById("messageContent").value.trim();
            const datetimeInput = document.getElementById("scheduleTime").value;

            if (!webhookUrl || !messageContent || !datetimeInput) {
                alert("Por favor, preencha a URL do Webhook, a Mensagem e a Data/Hora!");
                return;
            }

            // Converte a data selecionada para timestamp (milissegundos)
            const targetTime = new Date(datetimeInput).getTime();

            if (targetTime <= Date.now()) {
                alert("O horário escolhido precisa ser no futuro!");
                return;
            }

            // Monta o payload no formato exigido pelo Discord
            const discordPayload = {
                content: messageContent,
                username: username,
                ...(avatarUrl && { avatar_url: avatarUrl })
            };

            try {
                // Salva no Firestore usando exatamente os nomes que o disparador lê
                await addDoc(collection(db, "scheduled_messages"), {
                    url: webhookUrl,
                    targetTime: targetTime,
                    payload: JSON.stringify(discordPayload),
                    createdAt: Date.now()
                });

                alert("Mensagem agendada com sucesso na nuvem!");
                
                // Limpa os campos de texto principais
                document.getElementById("messageContent").value = "";
                document.getElementById("scheduleTime").value = "";
            } catch (error) {
                console.error("Erro ao agendar:", error);
                alert("Erro ao salvar o agendamento. Verifique o console.");
            }
        }

        document.getElementById("scheduleBtn").addEventListener("click", scheduleWebhook);
    </script>
</body>
</html>
